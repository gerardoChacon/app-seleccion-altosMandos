services:
  db:
    image: postgres:16
    container_name: sam_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: seleccion
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d seleccion"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: sam_backend
    volumes:
      - ./backend:/var/www
    working_dir: /var/www
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: seleccion
      DB_USERNAME: app
      DB_PASSWORD: app123
    command: >
      sh -c "
        composer update --no-interaction --prefer-dist &&
        php artisan key:generate --force &&
        php artisan migrate --force &&
        php artisan storage:link --force &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: sam_frontend
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    working_dir: /usr/src/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

  mobile:
    image: node:20-alpine
    container_name: sam_mobile
    network_mode: host
    stdin_open: true
    tty: true
    working_dir: /app
    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    command: >
      sh -c "
        apk add --no-cache iproute2 &&
        npm install &&
        HOST_IP=$$(ip route get 1 | awk '{print $$7; exit}') &&
        echo \"Usando IP: $$HOST_IP\" &&
        EXPO_PUBLIC_API_HOST=$$HOST_IP REACT_NATIVE_PACKAGER_HOSTNAME=$$HOST_IP npx expo start --lan
      "

volumes:
  postgres_data:
  frontend_node_modules:
  mobile_node_modules:
